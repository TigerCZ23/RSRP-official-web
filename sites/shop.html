<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./../res/styles/mainstyle.css">
  <link rel="stylesheet" href="./../res/styles/menu.css">
  <link rel="stylesheet" href="./../res/styles/shop.css">
  <title>VIP | RS:RP</title>
</head>
<body>
  <header>
    <div class="logo">
        <img src="./../res/icons/logo.png" alt="logo" width="50" height="50">
        <b>
            <span style="font-size: 25px; font-family: 'Nunito', 'Arial', sans-serif; font-style: italic;">:RP Reborn</span>
        </b>
    </div>

    <nav>
        <ul id="nav-list">
          <li><a href="main.html">Úvod</a></li>
          <li><a href="about.html">O nás & Kontakt</a></li>
          <li><a href="join-info.html">Informace & Pravidla</a></li>
          <li><a href="gallery.html">Galerie</a></li>
          <li><a href="a-team.html">Tým</a></li>
          <li><a style="text-decoration: underline;" href="shop.html">VIP | Shop</a></li>
          <li><a href="https://discord.gg/Zrw6rqtzZs" target="_blank">Discord</a></li>
        </ul>
    </nav>
    <div class="menu-toggle" onclick="toggleMenu()">
        <div></div><div></div><div></div>
    </div>

    <label class="theme-switch">
      <input type="checkbox" id="themeToggle">
      <span class="slider">
        <span class="thumb">
          <img src="./../res/icons/sun.png" class="icon icon-sun" alt="Sun">
          <img src="./../res/icons/moon.png" class="icon icon-moon" alt="Moon">
        </span>
      </span>
    </label>
  </header>

  <section class="vip-carousel">
  <button class="carousel-btn left" onclick="prevSlide()" aria-label="Předchozí VIP">❮</button>

  <div class="carousel-container">
    <div class="carousel-slide">
      <h2>VIP Bronze</h2>
      <p>Základní výhody pro začátečníky.</p>
    </div>
    <div class="carousel-slide">
      <h2>VIP Silver</h2>
      <p>Rozšířené možnosti a odměny.</p>
    </div>
    <div class="carousel-slide">
      <h2>VIP Gold</h2>
      <p>Kompletní přístup ke všemu + bonusy.</p>
    </div>
  </div>

  <button class="carousel-btn right" onclick="nextSlide()" aria-label="Následující VIP">❯</button>
  </section>


  <footer>
    <p>© 2025 RS:RP | <a href="about.html">Kontakt</a></p>
  </footer>

  <script src="./../res/scripts/core.js"></script>
  <script src="./../res/scripts/shop.js"></script>
</body>
</html>
